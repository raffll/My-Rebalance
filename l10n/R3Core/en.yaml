base_costs_name: "R3 spell effect base costs"
base_costs_description: "On: Core sets the R3 base cost of 38 spell effects (for example Fire Damage 5 -> 8, Feather 1 -> 0.1) and R3 - Spells converts spells to match. Off: vanilla base costs are kept and R3 - Spells changes nothing. Restart the game to apply."
walk_speed_name: "Movement speed"
walk_speed_description: "Walk speed of the player, NPCs and creatures (running and swimming follow it). Vanilla keeps the game values, +25% and +50% raise the walk speed range of everyone. Restart the game to apply."
